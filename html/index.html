<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DOCU FLOW | ระบบข้อมูลเอกสาร</title>


    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
    href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet">   

    <link
    href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet">


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<!-- =====================================================
     WELCOME PAGE
===================================================== -->

<section
    class="welcome-page"
    id="welcomePage"
>


    <!-- Background Shapes -->

    <div class="blob blob-top"></div>

    <div class="blob blob-bottom"></div>

    <div class="blob-red"></div>


    <!-- =================================================
         TOP BAR
    ================================================== -->

    <header class="topbar">

        <div class="brand">

            <span>
                ระบบข้อมูลเอกสาร
            </span>

            <span class="brand-line"></span>

        </div>


        <div class="top-menu">

            <span>
                สะดวก
            </span>

            <span>
                รวดเร็ว
            </span>

            <span>
                ครบจบในที่เดียว
            </span>

        </div>

    </header>


    <!-- =================================================
         HERO
    ================================================== -->

    <main class="hero">


        <!-- LEFT CONTENT -->

        <div class="hero-content">


            <h1 class="hero-title">

                Welcome<br>

                to the document information system

            </h1>


            <p class="hero-description">

                ค้นหาประเภทเอกสาร ช่องทางการรับ-ส่ง<br>

                และขั้นตอนการดำเนินงานได้ที่นี่

            </p>


            <!-- START BUTTON -->

            <button
                class="start-btn"
                id="startBtn"
            >

                <span>
                    START
                </span>

                <span class="start-arrow">
                    →
                </span>

            </button>


        </div>


        <!-- =================================================
             DOCUMENT ILLUSTRATION
        ================================================== -->

        <div class="documents">


            <!-- Paper 1 -->

            <div
                class="paper paper-1"
            ></div>


            <!-- Paper 2 -->

            <div
                class="paper paper-2"
            ></div>


            <!-- Folder -->

            <div class="folder">

                <div class="folder-inner">
                </div>


                <div class="folder-label">

                    DOCU<br>

                    FLOW

                </div>

            </div>


            <!-- Paper 3 -->

            <div
                class="paper paper-3"
            ></div>


            <!-- Paper 4 -->

            <div
                class="paper paper-4"
            ></div>


            <!-- Paper Clip -->

            <div class="clip">
            </div>


        </div>


    </main>


</section>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    src="../js/script.js"
></script>


</body>

</html>
