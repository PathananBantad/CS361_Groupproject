name: Backend CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check JavaScript syntax
        working-directory: .
        run: |
          find backend scripts aws frontend/js -path '*/node_modules' -prune -o -name '*.js' -print0 \
            | xargs -0 -n 1 node --check
      - run: npm test
