<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuFlow | Document Registry & Flow System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/document-modal.css">
</head>

<body>
    <!-- Decorative background -->
    <div class="page-decoration decoration-top" aria-hidden="true"></div>
    <div class="page-decoration decoration-bottom" aria-hidden="true"></div>

    <!-- Top navigation -->
    <header class="topbar">
        <a class="brand" href="dashboard.html" aria-label="DocuFlow หน้าหลัก">
            <span class="brand-mark" aria-hidden="true">
                <span></span><span></span>
            </span>
            <span class="brand-name">DocuFlow</span>
        </a>

        <nav class="nav-links">
            <a href="dashboard.html" class="active">หน้าหลัก</a>
            <a href="register.html">ลงทะเบียนเอกสาร</a>
            <a href="guide.html">คู่มือ</a>
        </nav>

        <div class="top-actions">
            <label class="top-search">
                <span aria-hidden="true">⌕</span>
                <input id="globalSearch" type="search" placeholder="ค้นหาเอกสาร..." autocomplete="off">
            </label>
            <span class="top-divider"></span>

            <!-- Role Selector & Profile Menu -->
            <div class="role-selector-wrap">
                <button class="profile-button" id="roleMenuBtn" type="button" aria-expanded="false"
                    title="คลิกเพื่อดูข้อมูลผู้ใช้และออกจากระบบ">
                    <span class="profile-icon role-staff" id="userRoleDot" aria-hidden="true">●</span>
                    <span id="userRoleDisplay">เจ้าหน้าที่ (Staff)</span>
                    <span class="chevron" aria-hidden="true">⌄</span>
                </button>
                <div class="role-dropdown" id="roleDropdown" hidden>
                    <div class="role-dropdown-header">
                        <span id="userRoleDropdownTitle">ข้อมูลผู้ใช้งาน</span>
                        <small id="userRoleDropdownEmail">ผู้ใช้งานระบบ DocuFlow</small>
                    </div>
                    <div style="border-top: 1px solid #f1e5e5; margin: 4px 0;"></div>
                    <button type="button" class="role-option" id="logoutBtn" style="color: #991b1b;">
                        <span class="role-badge" style="background: #fee2e2; color: #991b1b;">Exit</span>
                        <div class="role-info">
                            <strong style="color: #991b1b;">ออกจากระบบ (Logout)</strong>
                            <small>กลับสู่หน้าเข้าสู่ระบบ</small>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="page">
        <!-- Heading -->
        <section class="page-heading">
            <div>
                <h1>Document Registry <span>• <strong id="shownCount">0</strong> รายการ</span></h1>
            </div>
        </section>

        <!-- Filters Area (V3 Workflow Statuses) -->
        <div class="status-filters" role="tablist" aria-label="กรองข้อมูลเอกสารตามสถานะ">
            <button class="status-filter active" data-filter="all" role="tab">ทั้งหมด</button>
            <button class="status-filter" data-filter="Received" role="tab">ได้รับเอกสารแล้ว</button>
            <button class="status-filter" data-filter="Assigned" role="tab">มอบหมายแล้ว</button>
            <button class="status-filter" data-filter="Processing" role="tab">กำลังดำเนินการ</button>
            <button class="status-filter" data-filter="Completed" role="tab">ดำเนินการเสร็จสิ้น</button>
        </div>

        <!-- Main registry -->
        <section class="registry-layout">
            <div class="registry-card">
                <div class="registry-title">
                    <div class="registry-title-icon" aria-hidden="true">☷</div>
                    <div>
                        <h2>รายการติดตามเอกสาร</h2>
                        <p>Document Tracking & Verification</p>
                    </div>
                </div>

                <div class="table-wrap">
                    <table class="document-table">
                        <thead>
                            <tr>
                                <th data-sort="number">เลขที่เอกสาร <small>No.</small><span>↕</span></th>
                                <th data-sort="type">ประเภทเอกสาร <small>Type</small><span>↕</span></th>
                                <th data-sort="sender">ผู้ส่ง <small>Sender</small><span>↕</span></th>
                                <th data-sort="receiver">ผู้รับ <small>Receiver</small><span>↕</span></th>
                                <th data-sort="status">สถานะ <small>Status</small><span>↕</span></th>
                                <th data-sort="received">วันที่รับ <small>Received</small><span>↕</span></th>
                                <th style="text-align: center;">จัดการเอกสาร <small>Action</small></th>
                            </tr>
                        </thead>
                        <tbody id="documentTableBody"></tbody>
                    </table>
                </div>

                <div class="mobile-list" id="mobileList"></div>
            </div>
        </section>

        <!-- Bottom legend (V3 Workflow Statuses) -->
        <div class="status-legend" aria-label="คำอธิบายสถานะ">
            <button class="legend-item active" data-filter="all"><i class="dot dot-all"></i>ทั้งหมด</button>
            <button class="legend-item" data-filter="Received"><i class="dot dot-received"></i>ได้รับเอกสารแล้ว</button>
            <button class="legend-item" data-filter="Assigned"><i class="dot dot-assigned"></i>มอบหมายแล้ว</button>
            <button class="legend-item" data-filter="Processing"><i class="dot dot-processing"></i>กำลังดำเนินการ</button>
            <button class="legend-item" data-filter="Completed"><i class="dot dot-completed"></i>ดำเนินการเสร็จสิ้น</button>
        </div>
    </main>

    <!-- Document Details & Preview Modal Container (โหลดเทมเพลตแยกจาก document-modal.html) -->
    <div id="documentModalContainer"></div>

    <script src="../js/cognito-config.js"></script>
    <script src="../js/navbar-profile.js"></script>
    <script src="../js/document-modal.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/document-assignment.js"></script>

    <script>
        function renderAssignSection(documentId, currentAssigneeId) {
            return `
                <div class="assign-container" style="margin-top: 15px; padding: 15px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;">
                    <h4 style="margin-bottom: 10px; font-size: 15px; color: #374151;">จัดการการมอบหมายเอกสาร</h4>
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; font-size: 13px; margin-bottom: 4px; color: #4b5563;">ระบุรหัสผู้รับผิดชอบ (Assignee ID):</label>
                        <input type="text" id="modalAssigneeId" placeholder="ระบุ ID เช่น 1 หรือ 2..." style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; font-size: 13px; margin-bottom: 4px; color: #4b5563;">หมายเหตุการมอบหมาย:</label>
                        <input type="text" id="modalAssignRemarks" placeholder="ระบุเหตุผลการมอบหมาย (ถ้ามี)..." style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;">
                    </div>
                    <button type="button" onclick="submitDocumentAssignment('${documentId}')" style="background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500;">
                        ยืนยันการมอบหมาย
                    </button>
                </div>
            `;
        }

        async function submitDocumentAssignment(documentId) {
            const assigneeId = document.getElementById("modalAssigneeId").value.trim();
            const remarks = document.getElementById("modalAssignRemarks").value.trim();

            if (!assigneeId) {
                alert("กรุณาระบุรหัสผู้รับผิดชอบก่อนกดยืนยัน");
                return;
            }

            try {
                const apiBase = typeof getApiBaseUrl === "function" ? getApiBaseUrl() : "https://utvhg6d6o3.execute-api.us-east-1.amazonaws.com/api";
                const response = await window.apiFetch(`${apiBase}/documents/${documentId}/assign`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        assignee_id: assigneeId,
                        remarks: remarks
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "ไม่สามารถมอบหมายเอกสารได้");
                }

                alert("มอบหมายเอกสารสำเร็จเรียบร้อย!");
                location.reload();
            } catch (error) {
                console.error("Assignment error:", error);
                alert("เกิดข้อผิดพลาด: " + error.message);
            }
        }
    </script>

</body>

</html>
