<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DocuFlow | Register Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <!-- Decorative background -->
    <div class="bg-shape shape-top"></div>
    <div class="bg-shape shape-left"></div>
    <div class="bg-shape shape-right"></div>
    <div class="bg-shape shape-bottom"></div>

    <div class="paper paper-left">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="paper paper-right">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="paper paper-bottom">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- ================= NAVBAR ================= -->
    <header class="topbar">

        <!-- Logo -->
        <a class="brand" href="index.html">
            <span class="brand-mark">
                <span></span>
                <span></span>
            </span>

            <span>DocuFlow</span>
        </a>


        <!-- Navigation -->
        <nav class="nav-links">

            <a href="dashboard.html">
                หน้าหลัก
            </a>

            <a href="register.html" class="active">
                ลงทะเบียนเอกสาร
            </a>

            <a href="guide.html">
                คู่มือ
            </a>

        </nav>


        <!-- Right side -->
        <div class="top-actions">

            <div class="top-search">
                <span>⌕</span>

                <input type="text" placeholder="Search..." id="globalSearch">
            </div>

            <div class="top-divider"></div>

            <button class="profile-button" type="button">

                <span class="profile-icon">
                    ●
                </span>

                <span>Kyu</span>

                <span class="chevron">
                    ⌄
                </span>

            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->
    <main class="page">

        <section class="register-card">

            <div class="card-heading">

                <h1>Register Document</h1>

                <p>
                    Please fill in the details below.
                </p>

            </div>


            <form id="registerForm">

                <!-- ช่องทางรับเอกสาร -->
                <div class="field">
                    <label for="receiveChannel">
                        ช่องทางรับเอกสาร <span style="color: red;">*</span>
                    </label>

                    <div class="select-wrap">
                        <select id="receiveChannel" name="receiveChannel" required>
                            <option value="" selected disabled>
                                เลือกช่องทางรับเอกสาร...
                            </option>
                            <option value="EMAIL">อีเมล (Email)</option>
                            <option value="PAPER">ส่งด้วยตนเอง / เอกสารกระดาษ (Paper)</option>
                        </select>
                    </div>
                </div>

                <!-- เลือกประเภทเอกสาร -->
                <div class="field">
                    <label for="documentType">
                        ประเภทเอกสาร <span style="color: red;">*</span>
                    </label>

                     <div class="select-wrap">
                        <select id="documentType" name="documentType" required>
                            <option value="" selected disabled>
                                เลือกประเภทเอกสาร...
                            </option>
                            <option value="ประชาสัมพันธ์">เอกสารประชาสัมพันธ์</option>
                            <option value="ขออนุมัติ">เอกสารขออนุมัติ</option>
                            <option value="มอบหมายงาน">เอกสารมอบหมายงาน</option>
                            <option value="แจ้งเพื่อทราบ">เอกสารแจ้งเพื่อทราบ</option>
                            <option value="รอการตอบกลับ">เอกสารรอการตอบกลับ</option>
                            <option value="กำหนดการ/การนัดหมาย">เอกสารแจ้งกำหนดการ/การนัดหมาย</option>
                            <option value="รายงานผล">เอกสารรายงานผล</option>
                        </select>
                    </div>
                </div>

                <!-- เลขที่หนังสือ -->
                <div class="field">
                    <label for="docNo">เลขที่หนังสือ <span style="color: red;">*</span></label>
                    <input id="docNo" name="docNo" type="text" placeholder="ระบุเลขที่หนังสือ..." required>
                </div>

                <!-- เรื่อง -->
                <div class="field">
                    <label for="subject">เรื่อง <span style="color: red;">*</span></label>
                    <input id="subject" name="subject" type="text" placeholder="ระบุชื่อเรื่องเอกสาร..." required>
                </div>

                <!-- ข้อมูลหน่วยงานผู้ส่ง -->
                <div class="field">
                    <label for="senderDept">หน่วยงานผู้ส่ง <span style="color: red;">*</span></label>
                    <input id="senderDept" name="senderDept" type="text" placeholder="ระบุหน่วยงานที่ส่งมา..." required>
                </div>

                <!-- ชื่อผู้ส่ง -->
                <div class="field">
                    <label for="senderName">ชื่อผู้ส่ง <span style="color: red;">*</span></label>
                    <input id="senderName" name="senderName" type="text" placeholder="ระบุชื่อผู้ส่ง..." required>
                </div>

                <!-- ช่องทางติดต่อผู้ส่ง -->
                <div class="field">
                    <label for="senderContact">ช่องทางติดต่อผู้ส่ง <span style="color: red;">*</span></label>
                    <input id="senderContact" name="senderContact" type="text" placeholder="เบอร์โทรศัพท์ หรือ อีเมล..."
                        required>
                </div>

                <!-- ข้อมูลผู้รับ -->
                <div class="field">
                    <label for="recipient">หน่วยงานผู้รับ / ชื่อผู้รับ <span style="color: red;">*</span></label>
                    <input id="recipient" name="recipient" type="text" placeholder="ระบุผู้รับหรือหน่วยงาน..." required>
                </div>

                <!-- วันที่ส่งเอกสาร -->
                <div class="field">
                    <label for="sendDate">วันที่ส่งเอกสาร <span style="color: red;">*</span></label>
                    <input id="sendDate" name="sendDate" type="date" required>
                </div>

                <!-- วันที่รับเอกสาร -->
                <div class="field">
                    <label for="receiveDate">วันที่รับเอกสาร <span style="color: red;">*</span></label>
                    <input id="receiveDate" name="receiveDate" type="date" required>
                </div>

                <!-- Deadline (V2) -->
                <div class="field">
                    <label for="deadline">วันครบกำหนด (Deadline) <span
                            style="color: gray; font-size: 0.85em;">(ถ้ามี)</span></label>
                    <input id="deadline" name="deadline" type="date">
                </div>

                <!-- หมายเหตุ -->
                <div class="field">
                    <label for="remarks">หมายเหตุ</label>
                    <textarea id="remarks" name="remarks" placeholder="ระบุหมายเหตุเพิ่มเติม (ถ้ามี)..."></textarea>
                </div>

                <!-- แนบไฟล์เอกสาร -->
                <div class="field">
                    <label for="file">
                        แนบไฟล์เอกสาร <span style="color: red;">*</span>
                    </label>

                    <label class="upload-box" for="file">

                        <span id="fileText">
                            เลือกไฟล์ หรือลากไฟล์มาวางที่นี่...
                        </span>

                        <input
                            id="file"
                            name="file"
                            type="file"
                            accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"
                            required
                        >
                    </label>

                    <small class="file-hint">
                        รองรับไฟล์ PDF, JPG, PNG, DOC และ DOCX ขนาดไม่เกิน 10 MB
                    </small>
                </div>

                <!-- Submit -->
                <button class="submit-btn" id="submitBtn" type="submit">
                    <span>➤</span>
                    <span id="submitText">ลงทะเบียนเอกสาร</span>
                </button>

            </form>

        </section>

    </main>


    <script src="../js/register.js"></script>

</body>

</html>
